[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-math-verified-aug"
version = "0.0.1"
description = "Symbolic vs. LLM math-data augmentation for small models + the Vi-ExamMath benchmark"
requires-python = ">=3.11"
license = { text = "MIT" }
# Local CPU env (pipeline, verification, scoring, tables). Locked in uv.lock; pip users:
#   pip install -r requirements.lock.txt && pip install -e . --no-deps
# Floors = the versions verified in the project .venv / E:\venv_tools on 2026-11-07.
dependencies = [
    "sympy>=1.14",            # verify/, symbolic/, eval/math_verify.py
    "z3-solver>=4.13",        # verify/ (5.1 in .venv)
    "numpy>=2.0",             # eval/decontam.py
    "requests>=2.32",         # vi_exam/, eval_sets/, legacy clients
    "beautifulsoup4>=4.12",   # vi_exam/ (scrape, page, discover)
    "lxml>=5.0",              # bs4 parser used by vi_exam/
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# common/llm.py providers. httpx2 is the anthropic SDK's own HTTP stack and is reused for Gemini/NIM REST.
api = ["anthropic>=2.6", "httpx2>=2.12"]
# HF data access (eval_sets/fetch.py, eval/decontam.py)
data = ["pyarrow>=17", "huggingface-hub>=0.25"]
# optional expression backend of eval/math_verify.py (falls back to SymPy-only without it)
grader = ["math-verify>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5"]
# NOT here: the GPU/Kaggle stack (torch, transformers, peft, trl, unsloth, vllm, datasets ...). It is pinned
# separately by workstream Y1 for the Kaggle/Modal images (Linux x86_64 only); see
# docs/research_2026-11/exec/Y3_common.md §Environment.

[tool.setuptools.packages.find]
include = ["vi_math_verified_aug*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# The lock is universal (Windows + Linux); keep it CPU-only.
required-version = ">=0.5"
# Lock the result-bearing libraries at the versions the project .venv actually ran with (2026-11-07), so a
# fresh `uv sync --locked` reproduces verification/grading behaviour instead of picking up newer releases.
constraint-dependencies = [
    "sympy==1.14.0",
    "z3-solver==5.1.0.0",
    "numpy==2.4.6",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
]
